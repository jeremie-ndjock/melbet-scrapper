# Réglages du collecteur. Aucun secret ici (les secrets sont dans .env).
transport:
  base_url: https://melbet-cm.com
  # Identification honnête et fixe : pas de rotation, pas d'imitation de navigateur.
  user_agent: OddsCollector/1.0
  timeout_seconds: 10
  # Débit maximal vers le site (requêtes par seconde), tous appels confondus.
  max_requests_per_second: 1.0
  # Reprises : uniquement pour les erreurs transitoires (timeout, coupure réseau, 5xx).
  retry:
    max_attempts: 3
    base_delay_seconds: 0.5
    max_delay_seconds: 4.0
  circuit_breaker:
    failure_threshold: 5
    recovery_seconds: 30

# Paramètres de requête imposés par le site (relevés dans le navigateur, section 2 de Memoire.md).
site_params:
  fcountry: 84
  gr: 2147
  lng: fr
  ref: 8

# Source de secours (legacy GetChampZip/GetGameZip, section 2.4). Mêmes valeurs de pays et de
# partenaire que ci-dessus, sous les noms attendus par cette API plus ancienne.
legacy_site_params:
  country: 84
  partner: 8
  lng: fr

scheduler:
  poll_interval_seconds: 5

observability:
  # Port HTTP servant les métriques Prometheus (/metrics). Non exposé hors du réseau Docker
  # (voir docker-compose.yml) : seul Prometheus, dans le même réseau, y accède.
  metrics_port: 9100

alerting:
  # Une même alerte (même clé) n'est renvoyée qu'après ce délai, pour ne pas harceler
  # l'utilisateur ni dépasser le quota du domaine de démonstration Mailtrap (Memoire.md section 12).
  cooldown_seconds: 1800

dictionary:
  base_url: https://v3.cdnafric.com
  refresh_interval_hours: 6

results:
  # Rattrapage de l'historique au premier lancement (voir Memoire.md section 2.2 : au moins
  # 90 jours disponibles côté site). L'ancre de ce rattrapage est fixée une seule fois (results.py).
  backfill_days: 90
  # Réconciliation périodique des matchs récemment terminés (idempotente, sans point de contrôle).
  reconcile_lookback_hours: 2
  reconcile_interval_minutes: 5
