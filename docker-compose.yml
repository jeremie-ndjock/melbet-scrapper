# Étape 3 : base de données et exécution des tests. Les services scraper, prometheus et grafana
# seront ajoutés aux étapes suivantes. Aucun port n'est publié : la base n'est joignable que depuis
# le réseau Docker (accès manuel : `docker compose exec db psql -U $POSTGRES_USER $POSTGRES_DB`).
name: oddscollector

services:
  db:
    image: timescale/timescaledb:2.30.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Tests d'intégration : `docker compose --profile test run --rm tests`
  tests:
    profiles: ["test"]
    build:
      context: .
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - .:/app

volumes:
  db_data:
